[package]
name = "aios-core"
version = "0.0.1"
edition = "2021"

[lib]
name = "aios_core"
path = "src/lib.rs"

[[bin]]
name = "ai-os-chat"
path = "src/main.rs"

[[bin]]
name = "ai-os-engine"
path = "src/bin/ai-os-engine.rs"

[[bin]]
name = "ai-os-find"
path = "src/bin/ai-os-find.rs"

[[bin]]
name = "ai-os-alert"
path = "src/bin/ai-os-alert.rs"

[dependencies]
executor = { path = "../executor" }
aios-proto = { path = "../proto" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
ureq = { version = "2", features = ["json"] }
